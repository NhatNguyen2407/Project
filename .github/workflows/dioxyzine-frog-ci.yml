name: Dioxyzine Frog CI

on:
  pull_request:
    paths:
      - 'Working_Projects/Dioxyzine_Frog/**'
      - '.github/workflows/dioxyzine-frog-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Working_Projects/Dioxyzine_Frog/**'
      - '.github/workflows/dioxyzine-frog-ci.yml'

permissions:
  contents: read

concurrency:
  group: dioxyzine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Working_Projects/Dioxyzine_Frog
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: Working_Projects/Dioxyzine_Frog/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Test order and admin safety checks
        run: pnpm test
      - name: Set up Deno for payment entrypoints
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Type-check pinned PayPal server entrypoints without live credentials
        run: deno check --frozen --config supabase/functions/capture-paypal-order/deno.json supabase/functions/capture-paypal-order/index.ts supabase/functions/create-paypal-order/index.ts
      - name: Build Vite app
        run: pnpm build
